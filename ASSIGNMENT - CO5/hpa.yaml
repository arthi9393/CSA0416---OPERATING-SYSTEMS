# Horizontal Pod Autoscaler: scale 3 -> 6 (or more) when average CPU > 60 % of the request.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result-portal
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
