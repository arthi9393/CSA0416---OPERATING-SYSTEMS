# /etc/nginx/sites-available/portal  (symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx)
upstream portal_backend { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name portal.example.edu;

    location / {
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /static/ { alias /opt/portal/app/static/; expires 1d; }
}
